name: Install site archive
on:
  push:
    branches: [main]
    paths:
      - 'site-archive-parts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Reconstruct and validate website
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import shutil
          import zipfile

          folder = Path('site-archive-parts')
          parts = sorted(folder.glob('part*.bin'))
          assert len(parts) == 34, f'Expected 34 pieces, got {len(parts)}'
          archive = Path('site.zip')
          with archive.open('wb') as target:
              for part in parts:
                  with part.open('rb') as source:
                      shutil.copyfileobj(source, target)
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert digest == '5f67aea53954c2fda17e9bc5ce9b3cb021560314057960d127bc418328d546b1', digest
          with zipfile.ZipFile(archive) as website:
              assert len(website.namelist()) == 319
              assert website.testzip() is None
              assert 'index.html' in website.namelist()
              website.extractall('.')
          archive.unlink()
          shutil.rmtree(folder)
          Path('.nojekyll').touch()
          PY
      - name: Commit published files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Publish Chehlyandia v4.1"
          git push
